name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch pinned CLI release
        run: scripts/fetch-cli-release.sh

      - run: npm run check

      - run: npm test

      - name: Package platform VSIX (smoke)
        run: |
          scripts/stage-cli.sh linux-x64
          npx vsce package --no-dependencies --allow-missing-repository \
            --target linux-x64 -o tokitoki-vscode-linux-x64.vsix

      - name: Verify the VSIX bundles exactly one CLI binary
        run: |
          vsix=tokitoki-vscode-linux-x64.vsix
          unzip -l "$vsix" | grep -q "extension/bin/tokitoki-linux-amd64" || {
            echo "Missing linux-amd64 CLI in $vsix" >&2; exit 1; }
          count="$(unzip -l "$vsix" | grep -c "extension/bin/tokitoki-" || true)"
          if [ "$count" != "1" ]; then
            echo "Expected exactly one bundled CLI, found $count" >&2
            exit 1
          fi
